# ==============================================================
# Jerney - DevSecOps CI/CD Pipeline
# ==============================================================
# Triggers on every push and pull request.
# Stages: secret-scan→ Lint → SCA → Build → Image Scan → IaC Scan → Deploy Manifest Update
# ============================================================


# Stage 1


name: Jerney CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings 0

      - name: Build frontend
        if: matrix.service == 'frontend'
        run: npm run build

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --error \
            --exclude node_modules \
            --exclude dist \
            backend frontend


  sca:
    name: Dependency Audit - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sast

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high


  trivy-dockerfile:
    name: Trivy Dockerfile - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sast

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.service }}/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          version: v0.76.1

  # STAGE 2B: OPA Conftest Dockerfile Policy Enforcement
  opa-conftest:
    name: OPA Conftest - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sast

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.64.0/conftest_0.64.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.64.0_Linux_x86_64.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest

      - name: Enforce Dockerfile security policies
        run: |
          conftest test ${{ matrix.service }}/Dockerfile --policy policy
