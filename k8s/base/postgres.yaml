
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jerney
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
        - name: postgres
          image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER_FILE
              value: /etc/jerney/secrets/POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/jerney/secrets/POSTGRES_PASSWORD
            - name: POSTGRES_DB_FILE
              value: /etc/jerney/secrets/POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: db-secrets
              mountPath: /etc/jerney/secrets
              readOnly: true
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: postgres-tmp
              mountPath: /tmp

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(cat /etc/jerney/secrets/POSTGRES_USER)" -d "$(cat /etc/jerney/secrets/POSTGRES_DB)"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$(cat /etc/jerney/secrets/POSTGRES_USER)" -d "$(cat /etc/jerney/secrets/POSTGRES_DB)"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: db-secrets
          secret:
            secretName: jerney-db-secret
            defaultMode: 0440
        - name: postgres-run
          emptyDir:
            medium: Memory
        - name: postgres-tmp
          emptyDir:
            medium: Memory

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jerney
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: jerney
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jerney-ebs-sc
  resources:
    requests:
      storage: 10Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: jerney
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
