
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jerney
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 70
      containers:
        - name: backend
          image: deesecurity/jerney-backend@sha256:8b249486c8ba35634c68c5b74339bde131a20ddae00e9c09222bdbb6630fdb0a
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER_FILE
              value: "/etc/jerney/secrets/POSTGRES_USER"
            - name: DB_PASSWORD_FILE
              value: "/etc/jerney/secrets/POSTGRES_PASSWORD"
            - name: DB_NAME_FILE
              value: "/etc/jerney/secrets/POSTGRES_DB"
          volumeMounts:
            - name: backend-storage
              mountPath: /app/uploads
            - name: db-secrets
              mountPath: /etc/jerney/secrets
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-pvc
        - name: db-secrets
          secret:
            secretName: jerney-db-secret
            defaultMode: 0440

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jerney
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-pvc
  namespace: jerney
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jerney-ebs-sc
  resources:
    requests:
      storage: 5Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: jerney
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
