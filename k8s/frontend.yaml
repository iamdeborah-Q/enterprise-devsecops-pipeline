
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jerney
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001

      containers:
        - name: frontend
          image: deesecurity/jerney-frontend@sha256:af25a0b01fb843842343ef7df914589d3d513ac3af1ae8ea3482a540f749c2be:<digest>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: nginx-run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/cache/nginx

      volumes:
        - name: nginx-run
          emptyDir:
            medium: Memory
        - name: nginx-cache
          emptyDir:
            medium: Memory

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jerney
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: jerney
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
